; PlatformIO Project Configuration File
;
; M5Stack Core2 Ham Radio Companion

[env:m5stack-core2]
platform = espressif32@6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The default partition only allows ~1.25 MB for the app. We don't need OTA
; here, so switch to huge_app.csv (3 MB app + ~1.5 MB SPIFFS/LittleFS).
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
